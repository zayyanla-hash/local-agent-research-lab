   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #15283b" x="43.596" y="39.881344" transform="rotate(-0 43.596 39.881344)">Precision–recall for advisory authorization risk scores</text>
  </g>
  <g id="text_19">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #4f6272" transform="translate(43.596 342.992531)">Twenty matched synthetic allow/deny pairs. Higher scores rank denied context as positive. All tied scores enter together.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #4f6272" transform="translate(43.596 354.438281)">Precision depends on the study's 50% positive share. The curves are advisory and measure no real attack prevalence.</text>
  </g>
